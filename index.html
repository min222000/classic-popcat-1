<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>POPCAT CLASSIC</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #bdaa90;
        }
        .title-box {
            width: 80%;
            max-width: 600px;
            margin-top: 2em;
            display: flex;
            justify-content: center;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .title-img { max-width: 100%; height: auto; display: block; }
        .text-box {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            color: #ffffff;
            font-size: 80px;
            -webkit-text-stroke: 3px #000000;
            background-position: bottom;
            background-size: contain;
            background-repeat: no-repeat;
            background-color: transparent;
            padding: 2em 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .text-small {
            width: 100%;
            max-width: 800px;
            margin: 1em auto;
            text-align: center;
            color: #ffffff;
            font-size: 40px;
            -webkit-text-stroke: 2px #000000;
            background-position: bottom;
            background-size: contain;
            background-repeat: no-repeat;
            background-color: transparent;
            padding: 1em 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        /* default background for main counter */
        #p { background-image: url("imgs/p.png"); }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-box">
            <img src="imgs/popcat.svg" alt="POPCAT" class="title-img">
        </div>
        <div class="text-box" id="p">0</div>
    </div>

    <!-- counter logic -->
    <script>
        // 計數器初始化
        let count = 0;

        // 取得顯示元素
        const countEl = document.getElementById('p');

        // 增加計數並在 console 觀察
        function increment() {
            count++;
            console.log(count);
        }

        // 每次點擊時更新顯示
        function updateDisplay() {
            countEl.textContent = count;
        }

        // 整合：點擊時調用並切換圖片
        function handleMouseDown() {
            increment();
            updateDisplay();
            countEl.style.backgroundImage = 'url("imgs/op.png")';
        }

        function handleMouseUp() {
            countEl.style.backgroundImage = 'url("imgs/p.png")';
        }

        // 註冊事件到 container
        const container = document.querySelector('.container');
        container.addEventListener('mousedown', handleMouseDown);
        container.addEventListener('mouseup', handleMouseUp);
    </script>
</body>
</html>
